<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agencia de Streamers familia Pretty Woman">
    <link rel="icon" href="{{ url_for('static', filename='logoPw.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <meta name="autor" content="Andres_Martinez">
    <title>Nuevo Registro</title>
</head>

<body>
    <header>
        <a href="{{ url_for('main_routes.index') }}" class="logo">
            <img src="{{ url_for('static', filename='logoPw.png') }}" alt="Logo Agencia Pretty Woman">
            <span>Team Andy</span>
        </a>
    </header>
    <nav class="sidebar">
        <ul>
            {% if rol == 'Tutor' %}
            <li><a href="{{ url_for('main_routes.dashboard') }}">Inicio</a></li>
            <li><a href="{{ url_for('main_routes.nuevoRegistro') }}">Registrar</a></li>

            <li><a href="{{ url_for('main_routes.logout') }}">Cerrar sesión</a></li>
            {% elif rol == 'Lider' %}
            <li><a href="{{ url_for('main_routes.dashboard') }}">Inicio</a></li>
            <li><a href="{{ url_for('main_routes.nuevoRegistro') }}">Registrar</a></li>
            <li><a href="{{ url_for('main_routes.registros') }}">Tablas</a></li>
            <li><a href="{{ url_for('main_routes.ganancias') }}">Cobrando</a></li>
            <li><a href="{{ url_for('main_routes.logout') }}">Cerrar sesión</a></li>
            {% endif %}
        </ul>
    </nav>
    <main>
        <h1>Pagina Lideres</h1>
        <button>Buscar Lider</button>
        <button>Agregar lider</button>
        <section>
            <li></li>
        </section>
    </main>
</body>

</html>
