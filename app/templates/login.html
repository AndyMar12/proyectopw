<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agencia de Streamers familia Pretty Woman">
    <link rel="icon" href="{{ url_for('static', filename='logoPw.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <meta name="autor" content="Andres_Martinez">
    <title>Pretty Woman Agency</title>
</head>

<body>
    <header>
        <a href="{{ url_for('main_routes.index') }}" class="logo">
            <img src="{{ url_for('static', filename='logoPw.png') }}" alt="Logo Agencia Pretty Woman">
            <span>Team Andy</span>
        </a>
    </header>
    <main class="inicioSesion">
            <h1>Inicio de Sesión</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <ul>
                {% for category, message in messages %}
                <li style="color: red;">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('main_routes.login') }}" method="POST">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required><br>

                <label for="password">Contraseña:</label>
                <input type="password" id="contraseña" name="password" required><br>

                <center><button type="submit">Iniciar Sesión</button></center>
            </form>
    </main>
</body>

</html>
