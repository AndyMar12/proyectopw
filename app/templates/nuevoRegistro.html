<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agencia de Streamers familia Pretty Woman">
    <link rel="icon" href="{{ url_for('static', filename='logoPw.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <meta name="autor" content="Andres_Martinez">
    <title>Nuevo Registro</title>

    <script>
        var datos = {{ datos | tojson }};

        function actualizarFormulario(event) {
            event.preventDefault();
            var appSelect = document.getElementById("appNombre").value;

            if (appSelect) {
                const registros = document.getElementById("registros");
                registros.innerHTML = '';
                registros.style.display = "block";
                datos[appSelect].forEach(element => {
                    const label = document.createElement("label");
                    label.setAttribute("for", element);
                    label.textContent = element+":";
                    const input = document.createElement("input");
                    input.setAttribute("type", "text");
                    input.setAttribute("id", element);
                    input.setAttribute("name", element);
                    input.setAttribute("required", "");

                    const div = document.createElement("div");
                    div.appendChild(label);
                    div.appendChild(input);

                    // Agregar el contenedor al formulario
                    registros.appendChild(div);
                });
            }
        }
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("appNombre").addEventListener("change", actualizarFormulario);
        });
    </script>
</head>

<body>
    <header>
        <a href="{{ url_for('main_routes.index') }}" class="logo">
            <img src="{{ url_for('static', filename='logoPw.png') }}" alt="Logo Agencia Pretty Woman">
            <span>Team Andy</span>
        </a>
    </header>
    <nav class="sidebar">
        <ul>
            {% if rol == 'Tutor' %}
            <li><a href="{{ url_for('main_routes.dashboard') }}">Inicio</a></li>
            <li><a href="{{ url_for('main_routes.nuevoRegistro') }}">Registrar</a></li>
            <li><a href="{{ url_for('main_routes.registros') }}">Tablas</a></li>
            <li><a href="{{ url_for('main_routes.ganancias') }}">Cobrando</a></li>
            <li><a href="{{ url_for('main_routes.lideres') }}">Lideres</a></li>
            <li><a href="{{ url_for('main_routes.logout') }}">Cerrar sesión</a></li>
            {% elif rol == 'Lider' %}
            <li><a href="{{ url_for('main_routes.dashboard') }}">Inicio</a></li>
            <li><a href="{{ url_for('main_routes.nuevoRegistro') }}">Registrar</a></li>
            <li><a href="{{ url_for('main_routes.registros') }}">Tablas</a></li>
            <li><a href="{{ url_for('main_routes.ganancias') }}">Cobrando</a></li>
            <li><a href="{{ url_for('main_routes.logout') }}">Cerrar sesión</a></li>
            {% endif %}
        </ul>
    </nav>
    <main class="registrar">
        <br>
        <h1>Familia Pretty Woman</h1>
        <br>
        <form action="/nuevoRegistro" method="POST">
            <label for="appNombre">Selecciona la App:</label>
            <select id="appNombre" name="appNombre" onchange="actualizarFormulario(event)" required>
                <option value="">--Selecciona una App--</option>
                {% for tabla in tablas %}
                <option value="{{ tabla }}" {% if tabla==appNombre %}selected{% endif %}>{{ tabla }}</option>
                {% endfor %}
            </select><br><br>

            <div class="campo" id="registros" style="display:none">

            </div>

            <button type="submit">Guardar</button>
        </form>
    </main>
    <footer>
    </footer>
</body>

</html>
